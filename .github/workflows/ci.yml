name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies (CPU torch; versions from requirements.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.4 pytest==9.1.1
          python -m pip install "torch==2.14.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -v tests
